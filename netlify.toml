[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://radiant-ganache-cd273a.netlify.app"
  VITE_APP_ENV = "production"

# Production Context (main branch)
[context.production.environment]
  VITE_API_URL = "https://radiant-ganache-cd273a.netlify.app"
  VITE_APP_ENV = "production"

# QA Context (qa branch)
[context.qa.environment]
  VITE_API_URL = "https://qa--radiant-ganache-cd273a.netlify.app"
  VITE_APP_ENV = "qa"

# Development Context (dev branch)
[context.dev.environment]
  VITE_API_URL = "https://dev--radiant-ganache-cd273a.netlify.app"
  VITE_APP_ENV = "dev"

# Transparently proxy /api calls to the deployed backend
[[redirects]]
  from = "/api/*"
  to = "https://radiant-ganache-cd273a.netlify.app/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
