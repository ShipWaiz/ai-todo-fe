[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://radiant-ganache-cd273a.netlify.app"

# Transparently proxy /api calls to the deployed backend
[[redirects]]
  from = "/api/*"
  to = "https://radiant-ganache-cd273a.netlify.app/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
